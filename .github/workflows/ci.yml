name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  detect-schema-changes:
    name: Detect schema changes
    runs-on: ubuntu-latest

    outputs:
      schema_matrix: ${{ steps.changes.outputs.schema_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine changed schema types
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files="$(
              git diff --name-only \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}"
            )"
          elif [[ -n "${{ github.event.before }}" &&
                  "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.sha }}"
            )"
          else
            changed_files="$(
              git ls-tree -r --name-only "${{ github.sha }}"
            )"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          changed_types=()

          # The schema specification/path mapping is intentionally
          # explicit. It is part of the workflow configuration.
          #
          # Each entry has:
          #
          #   schema_type
          #   schema_paths
          #
          # A schema type may own multiple top-level directories.

          while IFS='|' read -r schema_type schema_paths; do
            [[ -n "$schema_type" ]] || continue

            type_changed=false

            IFS=',' read -ra paths <<< "$schema_paths"

            for schema_path in "${paths[@]}"; do
              if printf '%s\n' "$changed_files" |
                grep -q "^${schema_path}/"; then
                type_changed=true
                break
              fi
            done

            if [[ "$type_changed" == "true" ]]; then
              changed_types+=("$schema_type")
            fi
          done <<'SCHEMA_TYPES'
          JSON Schema|cartography
          # Add future schema specifications here.
          #
          # Example:
          #
          # Some Other Schema|another-directory,third-directory
          SCHEMA_TYPES

          if [[ "${#changed_types[@]}" -eq 0 ]]; then
            matrix='{"include":[]}'
          else
            matrix='{"include":['

            first=true

            for schema_type in "${changed_types[@]}"; do
              if [[ "$first" == "false" ]]; then
                matrix+=','
              fi

              matrix+="{\"schema_type\":\"${schema_type}\"}"

              first=false
            done

            matrix+=']}'
          fi

          echo "schema_matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "Schema matrix:"
          echo "$matrix"

  validate-schema:
    name: Validate ${{ matrix.schema_type }}
    needs: detect-schema-changes
    if: needs.detect-schema-changes.outputs.schema_matrix != '{"include":[]}'
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.schema_type }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-schema-changes.outputs.schema_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure schema type
        id: configuration
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.schema_type }}" in
            "JSON Schema")
              {
                echo 'schema_paths<<EOF'
                echo 'cartography'
                echo 'EOF'
                echo 'validator=ajv'
              } >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unknown schema type: ${{ matrix.schema_type }}"
              exit 1
              ;;
          esac

      - name: Setup Node.js
        if: steps.configuration.outputs.validator == 'ajv'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Ajv
        if: steps.configuration.outputs.validator == 'ajv'
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ajv"
          cd "$RUNNER_TEMP/ajv"

          npm init --yes

          npm install \
            ajv \
            ajv-formats \
            ajv-keywords

      - name: Validate versioned schema structure
        if: steps.configuration.outputs.validator == 'ajv'
        shell: bash
        env:
          SCHEMA_PATHS: ${{ steps.configuration.outputs.schema_paths }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const schemaPaths = process.env.SCHEMA_PATHS
            .split('\n')
            .map(value => value.trim())
            .filter(Boolean);

          const semverPattern =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

          for (const schemaPath of schemaPaths) {
            if (!fs.existsSync(schemaPath)) {
              throw new Error(
                `Schema path does not exist: ${schemaPath}`
              );
            }

            const families = fs.readdirSync(schemaPath, {
              withFileTypes: true
            }).filter(entry => entry.isDirectory());

            if (families.length === 0) {
              throw new Error(
                `No schema families found: ${schemaPath}`
              );
            }

            for (const familyEntry of families) {
              const family = familyEntry.name;
              const familyPath = path.join(
                schemaPath,
                family
              );

              const versions = fs.readdirSync(familyPath, {
                withFileTypes: true
              }).filter(entry => entry.isDirectory());

              if (versions.length === 0) {
                throw new Error(
                  `No schema versions found: ${familyPath}`
                );
              }

              for (const versionEntry of versions) {
                const version = versionEntry.name;
                const versionPath = path.join(
                  familyPath,
                  version
                );
                const schemaFile = path.join(
                  versionPath,
                  'schema.json'
                );

                if (!semverPattern.test(version)) {
                  throw new Error(
                    `Invalid schema version directory: ${versionPath}`
                  );
                }

                if (!fs.existsSync(schemaFile)) {
                  throw new Error(
                    `Missing schema.json: ${schemaFile}`
                  );
                }

                let schema;

                try {
                  schema = JSON.parse(
                    fs.readFileSync(schemaFile, 'utf8')
                  );
                } catch (error) {
                  throw new Error(
                    `Invalid JSON: ${schemaFile}\n${error.message}`
                  );
                }

                if (
                  typeof schema.$id !== 'string' ||
                  schema.$id.length === 0
                ) {
                  throw new Error(
                    `Schema is missing $id: ${schemaFile}`
                  );
                }

                const expectedSuffix =
                  `/${schemaPath}/${family}/${version}/schema.json`;

                if (!schema.$id.endsWith(expectedSuffix)) {
                  throw new Error(
                    [
                      `Schema $id does not correspond to its versioned path: ${schemaFile}`,
                      `Expected suffix: ${expectedSuffix}`,
                      `Actual $id: ${schema.$id}`
                    ].join('\n')
                  );
                }

                console.log(
                  `Structure valid: ${schemaFile}`
                );
              }
            }
          }
          NODE

      - name: Validate published schema immutability
        if: steps.configuration.outputs.validator == 'ajv' && github.event_name == 'pull_request'
        shell: bash
        env:
          SCHEMA_PATHS: ${{ steps.configuration.outputs.schema_paths }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const {
            execFileSync
          } = require('child_process');

          const fs = require('fs');
          const path = require('path');

          const schemaPaths = process.env.SCHEMA_PATHS
            .split('\n')
            .map(value => value.trim())
            .filter(Boolean);

          const baseSha = process.env.BASE_SHA;

          function gitShow(commit, file) {
            try {
              return execFileSync(
                'git',
                ['show', `${commit}:${file}`],
                {
                  encoding: 'utf8',
                  stdio: [
                    'ignore',
                    'pipe',
                    'ignore'
                  ]
                }
              );
            } catch {
              return null;
            }
          }

          for (const schemaPath of schemaPaths) {
            if (!fs.existsSync(schemaPath)) {
              continue;
            }

            const families = fs.readdirSync(schemaPath, {
              withFileTypes: true
            }).filter(entry => entry.isDirectory());

            for (const familyEntry of families) {
              const family = familyEntry.name;

              const familyPath = path.join(
                schemaPath,
                family
              );

              const versions = fs.readdirSync(familyPath, {
                withFileTypes: true
              }).filter(entry => entry.isDirectory());

              for (const versionEntry of versions) {
                const version = versionEntry.name;

                const schemaFile = path.join(
                  familyPath,
                  version,
                  'schema.json'
                );

                const relativeFile =
                  schemaFile.replace(/\\/g, '/');

                const baseContent = gitShow(
                  baseSha,
                  relativeFile
                );

                if (baseContent === null) {
                  continue;
                }

                const currentContent =
                  fs.readFileSync(
                    schemaFile,
                    'utf8'
                  );

                if (currentContent !== baseContent) {
                  throw new Error(
                    [
                      `Published schema version was modified: ${relativeFile}`,
                      `Existing version at ${baseSha} cannot be changed in place.`,
                      `Create a new schema version instead.`
                    ].join('\n')
                  );
                }
              }
            }
          }

          console.log(
            'Published schema immutability check passed.'
          );
          NODE

      - name: Validate latest schemas with Ajv
        if: steps.configuration.outputs.validator == 'ajv'
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/ajv/node_modules
          SCHEMA_PATHS: ${{ steps.configuration.outputs.schema_paths }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const Ajv2020 = require('ajv/dist/2020');
          const addFormats = require('ajv-formats');
          const addKeywords = require('ajv-keywords');

          const schemaPaths = process.env.SCHEMA_PATHS
            .split('\n')
            .map(value => value.trim())
            .filter(Boolean);

          const ajv = new Ajv2020({
            strict: true,
            allErrors: true
          });

          addFormats(ajv);

          addKeywords(
            ajv,
            ['uniqueItemProperties']
          );

          /*
           * Amiasea-specific keyword used by the Course schema.
           *
           * The schema declares the validation requirement.
           * The validation harness provides the Ajv implementation.
           */
          ajv.addKeyword({
            keyword: 'uniqueItemPropertyPaths',
            type: 'array',
            schemaType: 'array',
            errors: true,

            compile(paths) {
              function getValue(object, pointer) {
                let value = object;

                for (const segment of pointer
                  .replace(/^\/+/, '')
                  .split('/')) {

                  if (segment === '') {
                    continue;
                  }

                  const decoded = segment
                    .replace(/~1/g, '/')
                    .replace(/~0/g, '~');

                  if (
                    value === null ||
                    value === undefined
                  ) {
                    return undefined;
                  }

                  value = value[decoded];
                }

                return value;
              }

              function validate(data) {
                if (!Array.isArray(data)) {
                  return true;
                }

                for (const pointer of paths) {
                  const seen = new Set();

                  for (const item of data) {
                    const value = getValue(
                      item,
                      pointer
                    );

                    if (value === undefined) {
                      continue;
                    }

                    const serialized =
                      JSON.stringify(value);

                    if (seen.has(serialized)) {
                      validate.errors = [{
                        instancePath: '',
                        schemaPath:
                          '#/uniqueItemPropertyPaths',
                        keyword:
                          'uniqueItemPropertyPaths',
                        params: {
                          pointer
                        },
                        message:
                          `items must have unique values at ${pointer}`
                      }];

                      return false;
                    }

                    seen.add(serialized);
                  }
                }

                return true;
              }

              return validate;
            }
          });

          function parseSemVer(version) {
            const match = version.match(
              /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/
            );

            if (!match) {
              throw new Error(
                `Invalid SemVer directory: ${version}`
              );
            }

            return {
              core: [
                Number(match[1]),
                Number(match[2]),
                Number(match[3])
              ],
              prerelease: match[4]
                ? match[4].split('.')
                : []
            };
          }

          function compareIdentifiers(a, b) {
            const aNumeric = /^\d+$/.test(a);
            const bNumeric = /^\d+$/.test(b);

            if (aNumeric && bNumeric) {
              return Number(a) - Number(b);
            }

            if (aNumeric && !bNumeric) {
              return -1;
            }

            if (!aNumeric && bNumeric) {
              return 1;
            }

            return a.localeCompare(b);
          }

          function compareSemVerDescending(a, b) {
            const av = parseSemVer(a);
            const bv = parseSemVer(b);

            for (let index = 0; index < 3; index++) {
              if (av.core[index] !== bv.core[index]) {
                return bv.core[index] - av.core[index];
              }
            }

            const aPre = av.prerelease;
            const bPre = bv.prerelease;

            if (
              aPre.length === 0 &&
              bPre.length === 0
            ) {
              return 0;
            }

            if (aPre.length === 0) {
              return -1;
            }

            if (bPre.length === 0) {
              return 1;
            }

            const length = Math.max(
              aPre.length,
              bPre.length
            );

            for (
              let index = 0;
              index < length;
              index++
            ) {
              if (index >= aPre.length) {
                return -1;
              }

              if (index >= bPre.length) {
                return 1;
              }

              const comparison =
                compareIdentifiers(
                  aPre[index],
                  bPre[index]
                );

              if (comparison !== 0) {
                return -comparison;
              }
            }

            return 0;
          }

          /*
           * Discover every versioned schema in the explicitly declared
           * JSON Schema validation domains.
           */
          const schemas = [];

          for (const schemaPath of schemaPaths) {
            const families = fs.readdirSync(
              schemaPath,
              {
                withFileTypes: true
              }
            ).filter(
              entry => entry.isDirectory()
            );

            for (const familyEntry of families) {
              const family = familyEntry.name;

              const familyPath = path.join(
                schemaPath,
                family
              );

              const versions = fs.readdirSync(
                familyPath,
                {
                  withFileTypes: true
                }
              ).filter(
                entry => entry.isDirectory()
              ).map(
                entry => entry.name
              ).sort(
                compareSemVerDescending
              );

              for (const version of versions) {
                const schemaFile = path.join(
                  familyPath,
                  version,
                  'schema.json'
                );

                const schema = JSON.parse(
                  fs.readFileSync(
                    schemaFile,
                    'utf8'
                  )
                );

                if (
                  typeof schema.$id !== 'string' ||
                  schema.$id.length === 0
                ) {
                  throw new Error(
                    `Schema is missing $id: ${schemaFile}`
                  );
                }

                schemas.push({
                  schemaPath,
                  family,
                  version,
                  schemaFile,
                  schema
                });
              }
            }
          }

          /*
           * Register every schema from the CURRENT CHECKED-OUT
           * Git revision.
           *
           * The declared $id identifies the logical schema resource.
           * It is not used as an instruction to fetch the resource
           * from GitHub.
           *
           * The checked-out repository is the registry for this
           * validation run.
           *
           * Therefore, when a PR changes multiple schemas together,
           * the entire reference graph comes from the same revision:
           *
           *     Course @ PR SHA
           *          |
           *          +--> Position @ PR SHA
           *                    |
           *                    +--> Milestone @ PR SHA
           */
          for (const entry of schemas) {
            ajv.addSchema(entry.schema);

            console.log(
              `Registered ${entry.schemaFile} as ${entry.schema.$id}`
            );
          }

          /*
           * Only the latest schema in each family is actively compiled.
           *
           * Historical versions remain registered because a current
           * schema may contain an exact versioned $ref to one of them.
           *
           * Registration is therefore necessary for reference
           * resolution, but does not make every historical version
           * an active validation target.
           */
          const latestByFamily = new Map();

          for (const entry of schemas) {
            const key =
              `${entry.schemaPath}/${entry.family}`;

            if (!latestByFamily.has(key)) {
              latestByFamily.set(key, entry);
            }
          }

          for (const entry of latestByFamily.values()) {
            console.log(
              `Validating latest ${entry.schemaFile}`
            );

            try {
              ajv.compile(entry.schema);
            } catch (error) {
              console.error(
                `Schema validation failed: ${entry.schemaFile}`
              );

              console.error(
                error.message
              );

              if (error.errors) {
                console.error(
                  ajv.errorsText(
                    error.errors,
                    {
                      separator: '\n'
                    }
                  )
                );
              }

              process.exit(1);
            }

            console.log(
              `Schema valid: ${entry.schemaFile}`
            );
          }
          NODE